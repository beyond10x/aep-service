[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2024-0449", reason = "unmaintained, no fixed version; reached through serde_yaml 0.9 pinned by aep (aep Cargo.toml:59); remove when aep replaces serde_yaml" },
]

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "allow"
# Cargo-deny classifies workspace and path dependencies as wildcards after synthesizing manifests
# for the two pinned git workspaces. Exact git tags and one root declaration enforce those edges.
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
  "https://github.com/beyond10x/aep",
  "https://github.com/beyond10x/entity-runtime",
]
