name: Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: aep_gate
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aep_gate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ENTITY_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/aep_gate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315 # 1.85.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2
      - name: Install protocol
        run: |
          cargo install --git https://github.com/beyond10x/engineering-protocols --tag 0.38.1 --locked protocol-cli
      - name: Install cargo-deny with its own pinned toolchain
        run: |
          # Audit tooling may move faster than the service MSRV. Keep the service gate on 1.85
          # while compiling the pinned auditor with the minimum toolchain it requires.
          rustup toolchain install 1.88.0 --profile minimal
          cargo +1.88.0 install cargo-deny --version 0.20.2 --locked
      - run: task check

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315 # 1.85.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2
      - run: task site-build
