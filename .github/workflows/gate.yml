name: Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: aep_gate
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aep_gate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ENTITY_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/aep_gate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315 # 1.85.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ github.token }}
      - name: Restore pinned gate tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ runner.temp }}/specification-tools/bin/aep
            ${{ runner.temp }}/specification-tools/bin/protocol
            ~/.cargo/bin/cargo-deny
          key: ${{ runner.os }}-${{ runner.arch }}-gate-tools-aep-0.53.0-cargo-deny-0.20.2-v2
      - name: Install protocol
        run: |
          tool_root="$RUNNER_TEMP/specification-tools"
          if [ "$("$tool_root/bin/aep" --version 2>/dev/null || true)" != "protocol 0.53.0" ] || \
             [ "$("$tool_root/bin/protocol" --version 2>/dev/null || true)" != "protocol 0.53.0" ]; then
            cargo install --root "$tool_root" --git https://github.com/beyond10x/aep --tag 0.53.0 --locked aep-cli
          fi
          echo "$tool_root/bin" >> "$GITHUB_PATH"
      - name: Install cargo-deny with its own pinned toolchain
        run: |
          # Audit tooling may move faster than the service MSRV. Keep the service gate on 1.85
          # while compiling the pinned auditor with the minimum toolchain it requires.
          if [ "$(cargo deny --version 2>/dev/null || true)" != "cargo-deny 0.20.2" ]; then
            rustup toolchain install 1.88.0 --profile minimal
            cargo +1.88.0 install cargo-deny --version 0.20.2 --locked
          fi
      - run: task check

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315 # 1.85.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ github.token }}
      - run: task site-build
