name: Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: aep_gate
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aep_gate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ENTITY_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/aep_gate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315 # 1.85.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2
      - name: Restore pinned gate tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/bin/aep
            ~/.cargo/bin/protocol
            ~/.cargo/bin/cargo-deny
          key: ${{ runner.os }}-${{ runner.arch }}-gate-tools-aep-0.52.0-cargo-deny-0.20.2-v1
      - name: Install protocol
        run: |
          if [ "$(aep --version 2>/dev/null || true)" != "protocol 0.52.0" ] || \
             [ "$(protocol --version 2>/dev/null || true)" != "protocol 0.52.0" ]; then
            cargo install --force --git https://github.com/beyond10x/aep --tag 0.52.0 --locked aep-cli
          fi
      - name: Install cargo-deny with its own pinned toolchain
        run: |
          # Audit tooling may move faster than the service MSRV. Keep the service gate on 1.85
          # while compiling the pinned auditor with the minimum toolchain it requires.
          if [ "$(cargo deny --version 2>/dev/null || true)" != "cargo-deny 0.20.2" ]; then
            rustup toolchain install 1.88.0 --profile minimal
            cargo +1.88.0 install cargo-deny --version 0.20.2 --locked
          fi
      - run: task check

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315 # 1.85.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2
      - run: task site-build
