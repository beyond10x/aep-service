# Generated by `atlas docs reconcile`; edit Atlas documentation intent, not this file.
name: Documentation source bundle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/b10x-docs-bundle.yml'
      - 'b10x.docs.yaml'
      - 'changes/**/*.yaml'
      - 'website/docs/**/*.md'
      - 'website/static/**/*'
      - 'website/static/openapi.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b10x-docs-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    if: github.repository == 'beyond10x/aep-service' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87

      - name: Build normalized documentation bundle
        uses: beyond10x/docs-system/.github/actions/bundle@674157e32ba53b25bd67ea1f426b71368bebcdc2
        with:
          repository-root: .
          output: ${{ runner.temp }}/b10x-docs-bundle
          commit: ${{ github.sha }}
          run-id: ${{ github.run_id }}

      - name: Upload immutable documentation bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: b10x-docs-bundle
          path: ${{ runner.temp }}/b10x-docs-bundle
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
