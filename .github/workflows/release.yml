name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  gate:
    uses: ./.github/workflows/gate.yml

  binaries:
    needs: gate
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            executable: aep-service
            extension: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            executable: aep-service
            extension: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            executable: aep-service
            extension: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            executable: aep-service.exe
            extension: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.85.0
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked -p aep-service --target ${{ matrix.target }}
      - name: Package Unix archive
        if: matrix.extension == 'tar.gz'
        shell: bash
        run: |
          bundle="aep-service-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$bundle"
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" LICENSE README.md "$bundle/"
          tar -czf "$bundle.tar.gz" "$bundle"
      - name: Package Windows archive
        if: matrix.extension == 'zip'
        shell: pwsh
        run: |
          $bundle = "aep-service-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $bundle
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.executable }}", LICENSE, README.md -Destination $bundle
          Compress-Archive -Path $bundle -DestinationPath "$bundle.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aep-service-${{ matrix.target }}
          path: aep-service-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.extension }}

  github-release:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: aep-service-*
          merge-multiple: true
      - run: sha256sum aep-service-* > SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            aep-service-*
            SHA256SUMS

  image:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/beyond10x/aep-service:${{ github.ref_name }}
            ghcr.io/beyond10x/aep-service:preview
