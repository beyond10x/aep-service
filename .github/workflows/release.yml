name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  gate:
    uses: ./.github/workflows/gate.yml

  binaries:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.85.0
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-x86_64-unknown-linux-gnu
      - run: cargo build --release --locked -p aep-service --target x86_64-unknown-linux-gnu
      - name: Package archive
        shell: bash
        run: |
          bundle="aep-service-${{ github.ref_name }}-x86_64-unknown-linux-gnu"
          mkdir "$bundle"
          cp target/x86_64-unknown-linux-gnu/release/aep-service LICENSE README.md "$bundle/"
          tar -czf "$bundle.tar.gz" "$bundle"
          sha256sum "$bundle.tar.gz" > SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            aep-service-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz
            SHA256SUMS

  image:
    needs: gate
    # Compile on the target architecture: QEMU made the ARM release image take about an hour.
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            os: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push platform image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/beyond10x/aep-service:${{ github.ref_name }}-${{ matrix.arch }}
          cache-from: type=gha,scope=aep-service-image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=aep-service-image-${{ matrix.arch }},ignore-error=true
          provenance: mode=max
          sbom: true
      - name: Publish multiarch manifest
        if: matrix.arch == 'arm64'
        shell: bash
        run: |
          image="ghcr.io/beyond10x/aep-service"
          amd64="${image}:${GITHUB_REF_NAME}-amd64"
          arm64="${image}:${GITHUB_REF_NAME}-arm64"
          for attempt in {1..60}; do
            if docker buildx imagetools inspect "$amd64" >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "amd64 image did not become available" >&2
              exit 1
            fi
            sleep 5
          done
          docker buildx imagetools create \
            --tag "${image}:${GITHUB_REF_NAME}" \
            --tag "${image}:preview" \
            "$amd64" "$arm64"
