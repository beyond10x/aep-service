# Task runner for aep-service. Requires go-task (https://taskfile.dev).
version: "3"

tasks:
  default:
    desc: Run the complete local gate.
    deps: [check]

  check:
    desc: Refuse formatting, dependency-policy, lint, test, documentation, contract or plan drift.
    cmds:
      - cargo fmt --all -- --check
      - cargo deny check --hide-inclusion-graph
      - cargo clippy --workspace --all-targets --locked -- -D warnings
      - cargo test --workspace --locked
      - RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked
      - cargo +1.85 build --workspace --locked
      - task: openapi-check
      - aep artifact validate
      - |
        if [ -n "${ENTITY_POSTGRES_URL:-}" ]; then
          echo "postgres-check: passed, ENTITY_POSTGRES_URL set"
        else
          echo "postgres-check: skipped, ENTITY_POSTGRES_URL unset"
        fi

  openapi:
    desc: Generate the public OpenAPI asset from AEP-owned routes and DTO schemas.
    cmds:
      - cargo run --quiet --locked -p aep-service -- openapi > website/static/openapi.json

  openapi-check:
    desc: Refuse drift between the committed public OpenAPI asset and the service contract.
    cmds:
      - |
        candidate="$(mktemp "${TMPDIR:-/tmp}/aep-service-openapi.XXXXXX")"
        trap 'rm -f "$candidate"' EXIT
        cargo run --quiet --locked -p aep-service -- openapi > "$candidate"
        cmp "$candidate" website/static/openapi.json

  site-build:
    desc: Install website dependencies, generate OpenAPI, type-check and build the public site.
    dir: website
    cmds:
      - npm ci
      - npm audit --omit=dev --audit-level=critical
      - cargo run --quiet --locked -p aep-service --manifest-path ../Cargo.toml -- openapi > static/openapi.json
      - npm run typecheck
      - npm run build
