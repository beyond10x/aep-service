services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aep
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aep"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - aep-preview-postgres:/var/lib/postgresql/data

  aep-service:
    image: ghcr.io/beyond10x/aep-service:${AEP_SERVICE_VERSION:-0.1.1}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AEP_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/aep
      AEP_DEV_BEARER_TOKEN: ${AEP_DEV_BEARER_TOKEN:?set a local-only preview token}
    command:
      - serve
      - --bind
      - 0.0.0.0:8080
      - --allow-insecure-dev-listener
      - --realm
      - ${AEP_REALM:-demo}
      - --workspace
      - ${AEP_WORKSPACE:-plan}
      - --schema
      - ${AEP_SCHEMA:-aep_preview}
      - --definitions
      - /definitions
      - --definition-digest
      - ${AEP_DEFINITION_DIGEST:?set the digest of the mounted EP definition tree}
    healthcheck:
      test: ["CMD", "aep-service", "probe", "--address", "127.0.0.1:8080", "--readiness"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - ${AEP_DEFINITIONS_PATH:-../engineering-protocols}:/definitions:ro

volumes:
  aep-preview-postgres:
