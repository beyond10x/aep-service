[workspace]
resolver = "2"
members = [
    "crates/aep-service-app",
    "crates/aep-service-auth",
    "crates/aep-service-postgres",
    "crates/aep-service-http",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/beyond10x/aep-service"
authors = ["Beyond10x contributor <1379383+beyond10x@users.noreply.github.com>"]

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

